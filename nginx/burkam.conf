# Reverse-proxy snippet for nginx-gateway, the upstream nginx that fronts
# *.nandharu.uk subdomains via a Cloudflare Tunnel.
#
# `nginx-gateway` must be attached to the `server-net` Docker network so it
# can resolve `burkam-web` via Docker's embedded DNS (127.0.0.11). Verify with:
#   docker network inspect server-net | grep nginx-gateway
#
# We use a `resolver` + variable upstream so the config loads even when
# burkam-web is temporarily down (during deploys, restarts, crashes). Without
# this, an `nginx -t` will fail with "host not found in upstream" any time
# burkam-web isn't running.

limit_req_zone $binary_remote_addr zone=burkam_general:10m rate=20r/s;

server {
    listen 80;
    server_name burkam.nandharu.uk;

    # Profile photo uploads can be a few MB pre-resize. Match the
    # Next.js bodySizeLimit (10MB) so nginx doesn't truncate.
    client_max_body_size 10m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $burkam_upstream burkam-web:3000;

    location / {
        limit_req zone=burkam_general burst=40 nodelay;
        proxy_pass http://$burkam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Long-cache Next.js immutable static assets at the edge.
    location /_next/static/ {
        proxy_pass http://$burkam_upstream;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker must NEVER be cached at the edge.
    location = /sw.js {
        proxy_pass http://$burkam_upstream;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
