# Reverse-proxy snippet for the upstream nginx that fronts *.nandharu.uk.
# Drop into the same conf.d directory as learning_buddy.conf.

limit_req_zone $binary_remote_addr zone=khcc_general:10m rate=20r/s;

server {
    listen 80;
    server_name khcc.nandharu.uk;

    # Next.js handles /_next/static caching itself; keep nginx out of its way.
    location / {
        limit_req zone=khcc_general burst=40 nodelay;
        proxy_pass http://khcc-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Static assets — let Next handle, but allow long-lived browser caches.
    location /_next/static/ {
        proxy_pass http://khcc-web:3000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker must NEVER be cached at the edge.
    location = /sw.js {
        proxy_pass http://khcc-web:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
