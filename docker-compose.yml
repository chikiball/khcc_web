services:
  db:
    image: postgres:16-alpine
    container_name: burkam-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-burkam}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-burkam}
    volumes:
      - burkam_db_data:/var/lib/postgresql/data
    networks:
      - server-net
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-burkam} -d ${POSTGRES_DB:-burkam}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  burkam-web:
    build:
      context: .
      args:
        AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://burkam.nandharu.uk}
        # Mapbox token must be a build arg too — Next.js bakes
        # NEXT_PUBLIC_* into the client JS at build time.
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        # Server-action encryption key MUST be set at build time — Next.js
        # encrypts action IDs into the JS bundle when building. If absent
        # here, every build generates a fresh key and existing browser tabs
        # break with "Failed to find Server Action" after deploy.
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    container_name: burkam-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # DB — pg + drizzle-kit read these natively. Prefer PG* env vars over
      # DATABASE_URL because the URL form URL-decodes the password, breaking
      # any password that contains `+`, `/`, `=`, etc.
      # Use the container name `burkam-db` (not the service alias `db`) so we
      # never collide with another compose project on `server-net` that also
      # names its postgres service `db`.
      - PGHOST=burkam-db
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-burkam}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB:-burkam}
      # Auth.js
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - AUTH_URL=${NEXT_PUBLIC_SITE_URL:-https://burkam.nandharu.uk}
      - AUTH_TRUST_HOST=true
      # SMTP — Gmail relay via app password (or any SMTP provider)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      # Server Action encryption key — keeps action IDs stable across
      # deploys so open browser tabs do not get "Failed to find Server
      # Action" errors after a deploy. If unset, Next.js generates a
      # fresh key per build, breaking any in-flight client tabs.
      - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
      # Public (server-side reads only — Next.js bakes NEXT_PUBLIC_* into the
      # client bundle at build time via build args above)
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://burkam.nandharu.uk}
      - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN}
      # Cron secret — protects the ride-materialisation endpoint
      - CRON_SECRET=${CRON_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - server-net
    volumes:
      # User-uploaded avatars. Bound to a host directory so files survive
      # container rebuilds. The host directory is created by deploy.sh
      # if missing. Next.js serves /public/* at root so the public URL is
      # /uploads/avatars/<file>.
      - ./uploads:/app/public/uploads
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://127.0.0.1:3000/ > /dev/null 2>&1 || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  burkam_db_data:

networks:
  server-net:
    external: true
